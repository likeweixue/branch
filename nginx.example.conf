# ============================================================================
# ZUPÚ 族谱 · Nginx 部署示例（PHP 8 + PHP-FPM）
# 适用：域名指向本机，root 设为 zupu 目录，PHP 交由 php-fpm（sock 路径按实际改）
# ============================================================================

server {
    listen 80;
    server_name zupu.example.com;          # 改成你的域名或 _（本地用 localhost）
    root /var/www/zupu;                     # 改成实际部署路径
    index index.php;

    # 隐藏 data 目录，杜绝直接访问 JSON 数据
    location ^~ /data/ {
        deny all;
        return 403;
    }

    # 前端静态资源
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # 前端路由 / 干净 URL：除真实文件外都交给 index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP 处理
    location ~ \.php$ {
        fastcgi_pass   unix:/run/php/php8.2-fpm.sock;   # 按你的 php-fpm sock 调整（php8.0+ 均可）
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;
        # 防任意 PHP 执行于上传目录（本系统无上传，保留习惯）
        try_files      $fastcgi_script_name =404;
    }

    # 常规安全头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}

# 说明：
# 1) 本系统零数据库，所有数据存于 data/*.json；请将 data/ 设为不可通过 Web 访问（上面已 deny）。
# 2) PHP 需 8.0+；php-fpm sock 路径用 `ls /run/php/` 或 `systemctl status php*-fpm` 查。
# 3) 本地快速自测（无需 nginx）：在 zupu 目录下执行 `php -S 127.0.0.1:8080`，浏览器开 http://127.0.0.1:8080/
